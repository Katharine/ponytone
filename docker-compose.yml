version: '2'

services:
  db:
    image: postgres
    volumes:
    - ./postgres-data:/var/lib/postgresql/data
  redis:
    image: redis
  web:
    build: .
    command: sh -c 'sleep 5; python3 manage.py runserver 0.0.0.0:8000'
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
